name: Flutter

# Mobile app checks (NIWA-PLAN-A-02.md MA1.P4). Token freshness (`pnpm tokens:dart:check`) runs in ci.yml;
# the contract check is part of `flutter test` and reads packages/contracts/openapi.yaml.
on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'packages/tokens/**'
      - 'packages/contracts/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - 'packages/tokens/**'
      - 'packages/contracts/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      # Generated models (*.freezed.dart, *.g.dart) are committed; fail if they're stale.
      - run: dart run build_runner build -d
      - run: git diff --exit-code -- lib
      - run: flutter test
      - run: flutter build apk --debug
