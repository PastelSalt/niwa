        targetAnchorId:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
        label:
          type:
            - string
            - "null"
          maxLength: 120
      required:
        - sourceId
        - targetId
    ScheduleListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"
      required:
        - entries
    ScheduleEntry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        itemId:
          allOf:
            - $ref: "#/components/schemas/Id"
            - type:
                - string
                - "null"
        title:
          type: string
          description: Empty for blocks that use the item title
        startAt:
          $ref: "#/components/schemas/IsoDateTime"
        endAt:
          $ref: "#/components/schemas/IsoDateTime"
        isAllDay:
          type: boolean
        color:
          type:
            - string
            - "null"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        seriesId:
          type:
            - string
            - "null"
        seriesIndex:
          type:
            - integer
            - "null"
        createdAt:
          $ref: "#/components/schemas/IsoDateTime"
        updatedAt:
          $ref: "#/components/schemas/IsoDateTime"
      required:
        - id
        - kind
        - itemId
        - title
        - startAt
        - endAt
        - isAllDay
        - color
        - recurrence
        - seriesId
        - seriesIndex
        - createdAt
        - updatedAt
    ScheduleKind:
      type: string
      enum:
        - event
        - block
    Recurrence:
      type: string
      enum:
        - none
        - daily
        - weekly
        - monthly
    HolidayListResponse:
      type: object
      properties:
        country:
          type:
            - string
            - "null"
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/Holiday"
      required:
        - country
        - holidays
      description: Empty when the account has no country
    Holiday:
      type: object
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-03
          description: Calendar day; never shifted by time zone
        name:
          type: string
          description: English name
        localName:
          type: string
          description: Name in the country's language (may equal name)
        type:
          $ref: "#/components/schemas/HolidayType"
      required:
        - date
        - name
        - localName
        - type
    HolidayType:
      type: string
      enum:
        - public
        - bank
        - school
        - optional
        - observance
    HolidayPlacesResponse:
      type: object
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/HolidayPlace"
      required:
        - places
    HolidayPlace:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name
    ScheduleEntryResponse:
      type: object
      properties:
        entry:
          $ref: "#/components/schemas/ScheduleEntry"
      required:
        - entry
    CreateScheduleEntryInput:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        itemId:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{24}$
          example: 6745f0c2a1b2c3d4e5f60718
          description: Required for `block`, forbidden for `event`
        title:
          type: string
          maxLength: 300
          description: Required for events; optional for blocks (item title is shown)
        startAt:
          $ref: "#/components/schemas/IsoDateTime"
        endAt:
          $ref: "#/components/schemas/IsoDateTime"
        isAllDay:
          type: boolean
          default: false
        color:
          type:
            - string
            - "null"
          pattern: ^#[0-9a-fA-F]{6}$
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
      required:
        - kind
        - startAt
        - endAt
    TimeZone:
      type: string
      maxLength: 64
      default: UTC
      example: Asia/Manila
    EditScope:
      type: string
      enum:
        - instance
        - future
      default: instance
      description: '"this instance" or "this and future" — never silently "all"'
    UpdateScheduleEntryInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        startAt:
          $ref: "#/components/schemas/IsoDateTime"
        endAt:
          $ref: "#/components/schemas/IsoDateTime"
        isAllDay:
          type: boolean
        color:
          type:
            - string
            - "null"
          pattern: ^#[0-9a-fA-F]{6}$
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
    SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
      required:
        - hits
    SearchHit:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        snippet:
          type:
            - string
            - "null"
          description: Up to ~160 chars of the body around the first match
        matchedIn:
          type: string
          enum:
            - title
            - tags
            - content
        score:
          type: number
      required:
        - item
        - snippet
        - matchedIn
        - score
    UploadConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
        maxBytes:
          type: integer
        allowedMime:
          type: array
          items:
            type: string
      required:
        - enabled
        - maxBytes
        - allowedMime
    UploadSignatureResponse:
      type: object
      properties:
        cloudName:
          type: string
        apiKey:
          type: string
          description: Public Cloudinary API key (not the secret)
        timestamp:
          type: integer
        signature:
          type: string
        folder:
          type: string
        publicId:
          type: string
        tags:
          type: string
        allowedFormats:
          type: string
          description: Signed — send exactly as given
        uploadUrl:
          type: string
          format: uri
      required:
        - cloudName
        - apiKey
        - timestamp
        - signature
        - folder
        - publicId
        - tags
        - allowedFormats
        - uploadUrl
    UploadSignatureRequest:
      type: object
      properties:
        itemId:
          $ref: "#/components/schemas/Id"
      required:
        - itemId
    AttachmentResponse:
      type: object
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
      required:
        - attachment
    Attachment:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        itemId:
          $ref: "#/components/schemas/Id"
        cloudinaryPublicId:
          type: string
        secureUrl:
          type: string
          format: uri
        mime:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
        size:
          type: integer
        createdAt:
          $ref: "#/components/schemas/IsoDateTime"
      required:
        - id
        - itemId
        - cloudinaryPublicId
        - secureUrl
        - mime
        - size
        - createdAt
    ConfirmAttachmentInput:
      type: object
      properties:
        itemId:
          $ref: "#/components/schemas/Id"
        publicId:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - itemId
        - publicId
    AiStatusResponse:
      type: object
      properties:
        aiEnabled:
          type: boolean
        hasKey:
          type: boolean
        provider:
          type: string
          enum:
            - deepseek
      required:
        - aiEnabled
        - hasKey
        - provider
    SetAiKeyInput:
      type: object
      properties:
        apiKey:
          type: string
          minLength: 10
          maxLength: 512
      required:
        - apiKey
    AiSettingsInput:
      type: object
      properties:
        aiEnabled:
          type: boolean
      required:
        - aiEnabled
    SummarizeResponse:
      type: object
      properties:
        summary:
          type: string
      required:
        - summary
    AiActionInput:
      type: object
      properties:
        includeChildren:
          type: boolean
          default: false
      description: Only the targeted item (and optionally its children) is sent
    BreakdownResponse:
      type: object
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
          description: Created in Inbox as drafts, never filed
      required:
        - drafts
    AutoTagResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
          maxItems: 5
      required:
        - suggestions
      description: Suggestions only; the client applies accepted tags via PATCH
  parameters: {}
